<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Interactive Periodic Table">
  <rect width="1200" height="630" fill="#0e1116"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>
  <!-- a few colored element tiles, decorative -->
  <g>
    <rect x="80" y="190" width="110" height="110" rx="10" fill="#1c232d" stroke="#ff6b6b" stroke-width="4"/>
    <text x="135" y="262" font-family="Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#e9edf2" text-anchor="middle">Na</text>
    <rect x="210" y="190" width="110" height="110" rx="10" fill="#1c232d" stroke="#ffd43b" stroke-width="4"/>
    <text x="265" y="262" font-family="Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#e9edf2" text-anchor="middle">Fe</text>
    <rect x="340" y="190" width="110" height="110" rx="10" fill="#1c232d" stroke="#da77f2" stroke-width="4"/>
    <text x="395" y="262" font-family="Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#e9edf2" text-anchor="middle">Xe</text>
  </g>
  <text x="80" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="64" font-weight="800" fill="#e9edf2">Interactive Periodic Table</text>
  <text x="80" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="34" fill="#aeb8c4">All 118 elements — each with its own indexable page</text>
  <text x="80" y="556" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#4f9dff">elements.smolkin.org</text>
</svg>
