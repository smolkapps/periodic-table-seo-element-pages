name: CI
on:
  push:
  pull_request:
jobs:
  node:
    # Studio by default; STUDIO_CI_UBUNTU_LATEST='"ubuntu-latest"' restores hosted CI.
    runs-on: ${{ fromJSON(format(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || vars.STUDIO_CI_UBUNTU_LATEST || '["self-hosted","macOS","ARM64","studio-macos","studio-run-{0}"]', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        working-directory: .
        run: npm ci
      - name: build
        working-directory: .
        run: npm ci --prefix companion
      - name: build reference and study app
        working-directory: .
        run: npm run build
      - name: check reference types
        run: npm run check
      - name: verify published links and study tests
        run: npm run verify && npm test --prefix companion
      - name: check study types and lint
        run: npm run typecheck --prefix companion && npm run lint --prefix companion
      - name: test
        working-directory: .
        run: npm test
      - name: test atomic publication and preserve separate tutor
        run: python3 test/promote-elementa.test.py && test ! -f companion/src/pages/Tutor.jsx
      - name: Record checked release identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release-manifest.mjs create dist "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Upload checked website for automatic publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: elementa-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
